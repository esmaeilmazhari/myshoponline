{% extends 'shop/base.html' %}
{% block title %}پرداخت ناموفق | فروشگاه لوازم خانگی{% endblock %}

{% block content %}
    <div class="row justify-content-center mt-5">
        <div class="col-md-8 col-lg-6 text-center">
            <div class="card border-0 shadow-sm py-5" style="border-radius: 12px;">
                <div class="card-body">
                    <i class="bi bi-x-circle-fill text-danger" style="font-size: 5rem;"></i>
                    <h2 class="fw-bold mt-4 mb-3" style="color: #dc3545;">پرداخت ناموفق بود!</h2>
                    <p class="text-muted mb-4">متأسفانه در فرآیند پرداخت مشکلی پیش آمد. مبلغی از حساب شما کسر نشده است. لطفاً دوباره تلاش کنید.</p>
                    <div class="d-flex justify-content-center gap-3">
                        <a href="{% url 'shop:cart_detail' %}" class="btn btn-lg text-white px-4" style="background-color: #4A5A6A;">
                            بازگشت به سبد خرید
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
