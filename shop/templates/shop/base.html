<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}فروشگاه لوازم خانگی{% endblock %}</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    
    <style>
        /* تنظیمات کلی */
        body { 
            font-family: 'Vazirmatn', Tahoma, Arial, sans-serif; 
            background-color: #eef2f5; /* رنگ پس‌زمینه خاکستری-آبی ملایم */
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        
        /* رنگ هدر */
        .navbar-custom {
            background-color: #4A5A6A !important;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        /* تنظیمات فوتر */
        footer {
            margin-top: auto;
            background-color: #ffffff; /* فوتر سفید باشد تا با پس‌زمینه خاکستری تضاد داشته باشد */
        }
        
        main {
            flex: 1;
        }
    </style>
</head>
<body>
    <!-- هدر سایت -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold fs-4" href="{% url 'shop:product_list' %}">
                <i class="bi bi-house-door"></i> فروشگاه لوازم خانگی
            </a>
            
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link active" href="{% url 'shop:product_list' %}">صفحه اصلی</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'shop:product_list' %}">محصولات</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">درباره ما</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">تماس با ما</a></li>
                </ul>
                
                <!-- فرم جستجو در هدر -->
                <form class="d-flex me-lg-3 my-2 my-lg-0" method="get" action="{% url 'shop:product_list' %}">
                    <input class="form-control form-control-sm me-2" type="search" name="q" placeholder="جستجو..." aria-label="Search">
                    <button class="btn btn-outline-light btn-sm" type="submit">جستجو</button>
                </form>

                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link d-flex align-items-center" href="{% url 'shop:cart_detail' %}">
                            <span class="me-2">سبد خرید</span>
                            <i class="bi bi-cart3 fs-5"></i>
                            <span class="badge bg-danger rounded-pill ms-1">{{ cart|length }}</span>
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- محتوای اصلی -->
    <main class="container">
        {% block content %}
        {% endblock %}
    </main>

    <!-- فوتر -->
    <footer class="text-center py-4 mt-5 border-top">
        <div class="container">
            <p class="text-muted mb-0">&copy; ۲۰۲۶ فروشگاه لوازم خانگی - تمامی حقوق محفوظ است.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
