{% extends "shop/base.html" %}

{% block title %}
  {{ product.name }}
{% endblock %}

{% block content %}
  <div class="product-detail">
    <img src="{% if product.image %}{{ product.image.url }}{% else %}https://via.placeholder.com/300{% endif %}">
    <h1>{{ product.name }}</h1>
    <h2>
      <a href="{{ product.category.get_absolute_url }}">{{ product.category.name }}</a>
    </h2>
    <p class="price">تومان {{ product.price }}</p>
    
    <form action="{% url 'shop:cart_add' product.id %}" method="post">
      {{ cart_product_form }}
      {% csrf_token %}
      <input type="submit" value="افزودن به سبد خرید">
    </form>
    
    {{ product.description|linebreaks }}
  </div>
{% endblock %}
